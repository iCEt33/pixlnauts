<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-b0</title>

<style>
  /* Fill whatever frame we are given. NO background colour anywhere -- the
     marketplace supplies its own. (The customizer's styles.css sets #000 on
     .model-viewer; that is deliberately NOT copied here.) */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  model-viewer {
    width: 100%; height: 100%; display: block;
    background-color: transparent;
    --poster-color: transparent;   /* model-viewer's poster defaults to white */
  }
  /* Diagnostic overlay. OFF unless the address ends with &debug -- see
     "THE STATUS LINE" below. Invisible in normal use; still there when a
     robot fails to appear and you need to know which step died. */
  #status { display: none; }
  #status.on {
    display: block;
    position: fixed; top: 0; left: 0; margin: 0; padding: 6px 8px;
    font: 10px/1.45 ui-monospace, Menlo, Consolas, monospace;
    color: #0f0; background: rgba(0,0,0,.55);
    white-space: pre-wrap; pointer-events: none; max-width: 100%;
  }
  #status.ok { color: #6f6; opacity: .55; }
  #status.err { color: #f66; }
</style>

<!-- Same version the customizer uses. -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>

<body>

<model-viewer
  id="mv"
  alt="B-b0"
  camera-controls
  auto-rotate
  touch-action="pan-y"
  shadow-intensity="1"
  environment-image="neutral"
  exposure="1"
></model-viewer>

<pre id="status"></pre>

<script type="module">
/* ------------------------------------------------------------------ *
 * B-b0 renderer.  Reads ?config=n,n,n,n,n,n,n and rebuilds the robot.
 * Merge logic is loader.js loadAllModels(), with all UI/state removed.
 * ------------------------------------------------------------------ */

/* ---- 1. THE PARTS TABLE -------------------------------------------
 * Position in each array == the part id on-chain. APPEND ONLY -- add
 * new parts at the END of a category, never insert or reorder.
 * null == "None" (the accessory categories' index 0).
 * ------------------------------------------------------------------ */

    ],

    ],
    CLOTHES: [
      null,
      "accessories_clothes_drstrange.glb",
      "accessories_clothes_link.glb",
      "accessories_clothes_shell.glb",

      "accessories_clothes_leprechaun.glb",
      "accessories_clothes_goku.glb",

      "accessories_clothes_scarecrow.glb",

    ],
    ACC_FACE: [
      null,
      "accessories_face_mask.glb",

      null,
      "accessories_head_afro.glb",

      "accessories_head_goku.glb",

      "accessories_head_gokussjblue.glb",
      "accessories_head_gokussjgod.glb",
      "accessories_head_gokuultrainstinct.glb",
      "accessories_head_beanie.glb",
      "accessories_head_hockeymask.glb",
      "accessories_head_wolfears.glb",
      "accessories_head_antlers.glb",
      "accessories_head_pumpkin.glb",
      "accessories_head_scarecrow.glb",

      "accessories_head_link.glb",
      "accessories_head_headband.glb",
      "accessories_head_googlyeyes.glb",
      "accessories_head_helmet.glb",
      "accessories_head_christmashat.glb",
      "accessories_head_gandalfhat.glb",
      "accessories_head_porkpie.glb",
      "accessories_head_wizardhat.glb",
      "accessories_head_skurpy.glb",
      "accessories_head_birdnest.glb",
      "accessories_head_coffee.glb",
      "accessories_head_taco.glb",
      "accessories_head_lemon.glb",
      "accessories_head_chompie.glb",
      "accessories_head_anubis.glb"
    ]
  };

/* Contract category order, from mint-adapter.js ORDER. */
const ORDER = [
  { label: "Body",           list: PARTS.BODY     },
  { label: "Face",           list: PARTS.FACE     },
  { label: "Screen",         list: PARTS.SCREEN   },
  { label: "Specs",          list: PARTS.SPECS    },
  { label: "Clothes",        list: PARTS.CLOTHES  },
  { label: "Face Accessory", list: PARTS.ACC_FACE },
  { label: "Head Accessory", list: PARTS.ACC_HEAD },
];

/* ---- 2. STATUS LINE ------------------------------------------------
 * Visible on the page, not the console: inside a marketplace frame there
 * is no console to open. A blank robot and a blank config must look
 * different. Remove for production.
 * ------------------------------------------------------------------ */
const DEBUG = new URLSearchParams(location.search).has("debug");
const statusEl = document.getElementById("status");
const mv = document.getElementById("mv");
if (DEBUG) statusEl.classList.add("on");

const log = [];
let failed = false;
const paint = () => { if (DEBUG) statusEl.textContent = log.join("\n"); };
const say  = (t) => { log.push(t); paint(); };
const done = (t) => { if (DEBUG) { statusEl.classList.add("ok"); statusEl.textContent = t; } };
const die  = (t) => {
  failed = true;
  log.push("FAILED: " + t);
  if (DEBUG) statusEl.classList.add("err");
  paint();
  throw new Error(t);
};

/* ---- 3. READ THE CONFIG ------------------------------------------- */
say("url    " + location.search);

const raw = new URLSearchParams(location.search).get("config");
if (raw === null) die("no ?config= in the address");
say("config " + raw);

const nums = raw.split(",").map((s) => s.trim());
if (nums.length !== 7) die("expected 7 numbers, got " + nums.length);

const chosen = nums.map((s, i) => {
  const n = Number(s);
  if (!Number.isInteger(n) || n < 0) die(`${ORDER[i].label}: "${s}" is not a whole number`);
  if (n >= ORDER[i].list.length) die(`${ORDER[i].label}: ${n} is out of range (0-${ORDER[i].list.length - 1})`);
  return n;
});

/* Skip the nulls -- generic, exactly loader.js's guard. Not a special
   case for index 0. Collisions are ALREADY resolved on-chain; this page
   renders what it is given and runs no collision check. */
const files = [];
chosen.forEach((n, i) => {
  const f = ORDER[i].list[n];
  say(`  ${ORDER[i].label.padEnd(14)} ${String(n).padStart(2)}  ${f ?? "(none)"}`);
  if (f) files.push(f);
});
if (files.length === 0) die("nothing to load");

/* ---- 4. WAIT FOR THE LIBRARIES ------------------------------------ */
say("loading libraries...");

await Promise.race([
  customElements.whenDefined("model-viewer"),
  new Promise((_, rej) => setTimeout(() => rej(), 20000)),
]).catch(() => die("<model-viewer> never loaded (CDN blocked?)"));

/* Same three packages, same version, same CDN as loader.js initLoader(). */
let core, fns, ext;
try {
  [core, fns, ext] = await Promise.all([
    import("https://esm.sh/@gltf-transform/core@4.2.1"),
    import("https://esm.sh/@gltf-transform/functions@4.2.1"),
    import("https://esm.sh/@gltf-transform/extensions@4.2.1"),
  ]);
} catch (e) {
  die("glTF-Transform did not load from esm.sh - " + e.message);
}

/* ---- 5. THE MERGE -------------------------------------------------- */
const io = new core.WebIO();

/* MUST come before reading anything, or transparency and emissives break. */
io.registerExtensions([
  ext.KHRMaterialsTransmission,
  ext.KHRMaterialsIOR,
  ext.KHRMaterialsEmissiveStrength,
]);

const scaleDown = (doc) => {
  doc.getRoot().listNodes().forEach((node) => {
    const s = node.getScale();
    node.setScale([s[0] * 0.1, s[1] * 0.1, s[2] * 0.1]);
  });
};

const readPart = async (filename) => {
  const res = await fetch("models/" + filename);
  if (!res.ok) die(`models/${filename} -> HTTP ${res.status}`);
  return io.readBinary(new Uint8Array(await res.arrayBuffer()));
};

try {
  say(`merging ${files.length} part(s)...`);

  const baseDoc = await readPart(files[0]);
  scaleDown(baseDoc);

  for (let i = 1; i < files.length; i++) {
    const doc = await readPart(files[i]);
    scaleDown(doc);
    await fns.mergeDocuments(baseDoc, doc);
  }

  /* Fold every extra scene into scene 0. */
  const scenes = baseDoc.getRoot().listScenes();
  if (scenes.length > 1) {
    const main = scenes[0];
    for (let i = 1; i < scenes.length; i++) {
      scenes[i].listChildren().forEach((n) => main.addChild(n));
      scenes[i].dispose();
    }
  }

  /* One buffer instead of many. */
  await baseDoc.transform(fns.unpartition());

  const glb = await io.writeBinary(baseDoc);
  const url = URL.createObjectURL(new Blob([glb], { type: "model/gltf-binary" }));

  mv.addEventListener("load",  () => done(`${raw} - ${files.length} parts - ${(glb.byteLength / 1024).toFixed(0)} KB`), { once: true });
  mv.addEventListener("error", () => die("the merged model failed to display"), { once: true });

  mv.src = url;
} catch (e) {
  if (!failed) die(e.message);
}
</script>

</body>
</html>
